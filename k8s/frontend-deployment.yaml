apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: college-events
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-events
      tier: frontend
  template:
    metadata:
      labels:
        app: college-events
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vesit-group11/smart-event-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: college-events
    tier: frontend
spec:
  type: NodePort
  selector:
    app: college-events
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
