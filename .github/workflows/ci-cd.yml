name: CI/CD Pipeline - Smart College Event Management

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ==========================================
  # STAGE 1: Continuous Integration (CI) - Test & Lint
  # ==========================================
  test-and-build:
    name: 🧪 Run Automated Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 1. Backend Verification
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend CI Unit & Logic Tests
        working-directory: ./backend
        run: npm test

      # 2. Frontend Verification
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # STAGE 2: Continuous Delivery (CD) - Containerization
  # ==========================================
  docker-build-and-push:
    name: 🐳 Docker Container Build & Registry Push
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}

      - name: Build and Push Unified Full-Stack Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}

  # ==========================================
  # STAGE 3: Kubernetes Manifest Validation & Deploy Ready
  # ==========================================
  k8s-validate:
    name: ☸️ Kubernetes Manifest Lint & Dry-Run Validation
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubectl CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests (Dry-Run)
        run: |
          echo "Validating k8s configurations..."
          kubectl apply --dry-run=client --validate=false -f k8s/mysql-secret.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/mysql-pvc.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/mysql-deployment.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/backend-deployment.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/frontend-deployment.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/hpa.yaml
          echo "✅ All Kubernetes manifests are syntactically valid and production-ready!"
